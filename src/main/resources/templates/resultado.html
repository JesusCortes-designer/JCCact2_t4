<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empleado recibido</title>
</head>
<body>
    <h1>Empleado recibido</h1>
    <p>ID: <span th:text="${empleado.id}"></span></p>
    <p>Nombre: <span th:text="${empleado.nombre}"></span></p>
    <p>Apellido: <span th:text="${empleado.apellido}"></span></p>
    <p>Puesto: <span th:text="${empleado.puesto}"></span></p>
    <p>Edad: <span th:text="${empleado.edad}"></span></p>
    <a th:href="@{/mvc/lista}">Ver la lista</a>
</body>
</html>
