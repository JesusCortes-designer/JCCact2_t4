<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del empleado</title>
</head>
<body>
    <h1>Detalle del empleado</h1>
    <div th:if="${empleado != null}">
        <p>ID: <span th:text="${empleado.id}"></span></p>
        <p>Nombre: <span th:text="${empleado.nombre}"></span></p>
        <p>Apellido: <span th:text="${empleado.apellido}"></span></p>
        <p>Puesto: <span th:text="${empleado.puesto}"></span></p>
        <p>Edad: <span th:text="${empleado.edad}"></span></p>
    </div>
    <p th:if="${empleado == null}">No se encontró el empleado.</p>
    <a th:href="@{/mvc/lista}">Volver a la lista</a>
</body>
</html>
